version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: scentsensation-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: supabase_admin
      POSTGRES_PASSWORD: supabase_admin_password
      POSTGRES_DB: supabase
    volumes:
      - supabase_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supabase_admin"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth:
    image: supabase/auth:v2.190.0-rc.26
    container_name: scentsensation-auth
    restart: unless-stopped
    ports:
      - "9999:9999"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_admin:supabase_admin_password@scentsensation-postgres:5432/supabase?sslmode=disable
      GOTRUE_SITE_URL: http://localhost:8000
      GOTRUE_JWT_SECRET: super-secret-jwt-token-change-in-production-min-32-chars
      GOTRUE_JWT_EXP: 3600
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_ADMIN_EMAIL: admin@scentsensation.com
      GOTRUE_ADMIN_PASSWORD: admin123
      API_EXTERNAL_URL: http://localhost:9999

volumes:
  supabase_postgres_data:
