{% extends "store/base.html" %}
{% load static %}

{% block content %}
<div class="min-h-[calc(100vh-4rem)] flex items-center justify-center py-24 px-6">
  <div class="w-full max-w-lg text-center">

    <div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-burgundy-100 mb-6">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-10 h-10 text-burgundy-600">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </div>

    <h1 class="font-display text-3xl sm:text-4xl text-charcoal-900 tracking-display mb-4">Payment Failed</h1>
    <p class="text-charcoal-500 text-sm leading-relaxed mb-8">
      Something went wrong with your payment. No charges were made. Please try again or use a different payment method.
    </p>

    <div class="flex flex-col sm:flex-row gap-3 justify-center">
      <a href="{% url 'membership' %}" class="px-6 py-3 bg-charcoal-900 hover:bg-charcoal-800 text-cream-100 text-sm tracking-wide-plus uppercase font-medium rounded-brand transition-colors">
        Try Again
      </a>
      <a href="{% url 'homepage' %}" class="px-6 py-3 border border-charcoal-300 hover:border-charcoal-500 text-charcoal-700 text-sm tracking-wide-plus uppercase font-medium rounded-brand transition-colors">
        Back to Home
      </a>
    </div>

  </div>
</div>
{% endblock content %}
